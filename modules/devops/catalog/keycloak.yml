# title: Keycloak 26 (OIDC identity provider, dev mode, http://localhost:8180)
# env: OIDC_ISSUER_URL=http://localhost:8180/realms/app KEYCLOAK_ADMIN_PASSWORD=
# volumes:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports: ["8180:8080"]
