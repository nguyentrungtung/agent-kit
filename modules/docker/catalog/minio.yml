# title: MinIO (S3-compatible object storage, console :9001)
# env: S3_ENDPOINT=http://minio:9000 MINIO_ROOT_USER=app MINIO_ROOT_PASSWORD=
# volumes: miniodata
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-app}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-app-local-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
