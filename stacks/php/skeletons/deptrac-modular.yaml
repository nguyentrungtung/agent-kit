# agent-kit: deptrac for src/<Module>/<Layer>. Copy over deptrac.yaml when arch_style: modular.
deptrac:
  paths: [./src]
  layers:
    - { name: Api, collectors: [{ type: directory, value: 'src/[^/]+/Api/.*' }] }
    - { name: Presentation, collectors: [{ type: directory, value: 'src/[^/]+/Presentation/.*' }] }
    - { name: Application, collectors: [{ type: directory, value: 'src/[^/]+/Application/.*' }] }
    - { name: Domain, collectors: [{ type: directory, value: 'src/[^/]+/Domain/.*' }] }
    - { name: Infrastructure, collectors: [{ type: directory, value: 'src/[^/]+/Infrastructure/.*' }] }
  ruleset:
    Api: ~
    Presentation: [Application, Domain, Api]
    Application: [Domain, Api]
    Infrastructure: [Domain, Application, Api]
    Domain: ~
