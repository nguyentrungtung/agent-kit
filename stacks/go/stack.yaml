title: Go — gofmt/goimports, Effective Go + Go Code Review Comments, golangci-lint v2, govulncheck
detect: go.mod
globs: **/*.go
app_port: 8080
tools: go golangci-lint govulncheck
dev_deps:
cmd_install: go mod download
cmd_format: gofmt -w . && golangci-lint fmt
cmd_format_check: test -z "$(gofmt -l .)"
cmd_lint: golangci-lint run
cmd_typecheck: go vet ./...
cmd_arch:
cmd_test: go test -race ./...
cmd_build: go build ./...
cmd_audit: govulncheck ./...
post_note: install tools: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest && go install golang.org/x/vuln/cmd/govulncheck@latest. For layer rules enable depguard in .golangci.yml (see snippet).
