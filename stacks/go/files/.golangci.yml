# agent-kit: golangci-lint v2. Do not add //nolint without a reason comment.
version: "2"
run:
  timeout: 5m
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - contextcheck
    - errname
    - exhaustive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: receiver-naming
        - name: context-as-argument
formatters:
  enable:
    - gofumpt
    - goimports
