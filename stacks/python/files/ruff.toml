# agent-kit: Ruff = formatter (Black-compatible) + linter (pycodestyle, pyflakes, isort, pep8-naming, pydocstyle, bugbear, bandit…)
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "build", "dist"]

[lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "D",             # pydocstyle (PEP 257)
  "UP",            # pyupgrade
  "B",             # bugbear
  "S",             # bandit security
  "SIM", "C4", "RET", "PTH", "ERA",
  "ANN",           # type annotations
  "PL",            # pylint subset
  "C90",           # mccabe complexity
  "RUF",
]
ignore = ["D100", "D104", "D105", "D107", "ANN401"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-branches = 10
max-statements = 40

[lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
docstring-code-format = true
