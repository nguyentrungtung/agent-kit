; agent-kit: save as .importlinter, set root_package, then cmd_arch: lint-imports
[importlinter]
root_package = app

[importlinter:contract:layers]
name = Layered architecture
type = layers
layers =
    app.api
    app.services
    app.domain
ignore_imports =

[importlinter:contract:domain-pure]
name = Domain does not import frameworks
type = forbidden
source_modules = app.domain
forbidden_modules =
    fastapi
    django
    sqlalchemy
