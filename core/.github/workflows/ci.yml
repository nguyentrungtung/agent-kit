# agent-kit CI — quality + security gate for every PR. Make these checks REQUIRED in branch protection.
name: ci
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard (secrets, branch, commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          v=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Guard — secrets, PR history, branch name, Conventional Commits, traceability (script .agent/scripts/kit-ci)
        run: .agent/scripts/kit-ci guard

  quality:
    name: quality (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
# @@SETUP@@
      - run: .agent/scripts/kit-run install
      - run: .agent/scripts/kit-run format_check lint typecheck
      - run: .agent/scripts/kit-run arch
      - name: OpenSpec specs and changes valid
        run: .agent/scripts/kit-run specs
      - name: Task workflow gates (kit-task verify) — agents cannot skip them by opening the PR by hand
        run: .agent/scripts/kit-ci task-gates
      - name: API contract — Spectral lint, generated client up to date, no breaking change vs the target branch
        run: .agent/scripts/kit-ci api
      - name: Ops lint (Dockerfile, workflows, shell, compose, terraform, k8s)
        run: .agent/scripts/kit-run ops
      - name: Tests (+ coverage gate when cmd_coverage is set)
        run: .agent/scripts/kit-run testcov
      - name: Duplicated code
        run: .agent/scripts/kit-run dup
      - run: .agent/scripts/kit-run build
      - name: Diagrams render (docs)
        run: .agent/scripts/kit-run docs

  security:
    name: security (SAST + dependencies)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - name: SAST (semgrep)
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/default --config p/secrets --severity ERROR --error --metrics=off
      - name: Dependency & IaC scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (CycloneDX)
        if: hashFiles('.agent/scripts/kit-sec-scan') != ''
        run: .agent/scripts/kit-sec-scan sbom
      - name: Upload SBOM
        if: hashFiles('.agent/local/sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: sbom, path: .agent/local/sbom.cdx.json }
