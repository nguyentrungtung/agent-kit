# agent-kit CI — quality + security gate for every PR. Make these checks REQUIRED in branch protection.
name: ci
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard (secrets, branch, commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          v=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Secrets + forbidden files (whole repo)
        run: .agent/scripts/kit-secrets-scan --all
      - name: Secrets in PR history
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: gitleaks detect --no-banner --redact --log-opts="origin/$BASE_REF..HEAD"
      - name: Branch naming
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          b="$HEAD_REF"
          echo "$b" | grep -Eq '^(feature|fix|hotfix|refactor|chore|docs|test|release|revert)/' \
            || { echo "::error::branch '$b' must be <type>/TASK-NNN-slug"; exit 1; }
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          types="$(sed -n 's/^commit_types:[[:space:]]*//p' .agent/project.yaml)"
          bad=0
          while IFS= read -r s; do
            case "$s" in Merge\ *|Revert\ *) continue ;; esac
            echo "$s" | grep -Eq "^(${types})(\([A-Za-z0-9._/-]+\))?!?: .{3,}" || { echo "::error::bad commit subject: $s"; bad=1; }
          done < <(git log --format=%s "origin/$BASE_REF..HEAD")
          exit $bad
      - name: Traceability (ids referenced in docs/specs/tasks exist)
        run: .agent/scripts/kit-trace

  quality:
    name: quality (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
# @@SETUP@@
      - run: .agent/scripts/kit-run install
      - run: .agent/scripts/kit-run format_check lint typecheck
      - run: .agent/scripts/kit-run arch
      - name: OpenSpec specs and changes valid
        run: .agent/scripts/kit-run specs
      - name: Task workflow gates (kit-task verify) — agents cannot skip them by opening the PR by hand
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          id="$(printf '%s' "$HEAD_REF" | grep -oE 'TASK-[0-9]+' | head -n1 || true)"
          case "$HEAD_REF" in
            feature/*|fix/*|hotfix/*|refactor/*)
              [ -n "$id" ] || { echo "::error::code branch '$HEAD_REF' has no TASK-NNN — every code change needs a task (kit-task new / start)"; exit 1; } ;;
          esac
          [ -n "$id" ] || { echo "no task on this branch — skipped"; exit 0; }
          git fetch -q origin "$BASE_REF"
          KIT_BASE_REF="origin/$BASE_REF" .agent/scripts/kit-task verify "$id"
      - name: API contract lint (Spectral)
        if: hashFiles('docs/api/openapi.yaml') != ''
        run: .agent/scripts/kit-run api
      - name: Generated API client/types up to date with docs/api/openapi.yaml (cmd_apigen)
        if: hashFiles('docs/api/openapi.yaml') != ''
        run: |
          before="$(git status --porcelain)"
          .agent/scripts/kit-run apigen
          [ "$before" = "$(git status --porcelain)" ] || { git status --short; echo "::error::generated API client is stale — run .agent/scripts/kit-run apigen and commit"; exit 1; }
      - name: API breaking changes vs base branch (oasdiff)
        if: github.event_name == 'pull_request' && hashFiles('docs/api/openapi.yaml') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE_REF" --depth=1
          if git show "origin/$BASE_REF:docs/api/openapi.yaml" > /tmp/openapi-base.yaml 2>/dev/null; then
            docker run --rm -v /tmp:/base -v "$PWD/docs/api:/head" tufin/oasdiff:v1.11.1 breaking /base/openapi-base.yaml /head/openapi.yaml --fail-on ERR
          else echo "no base contract yet"; fi
      - name: Ops lint (Dockerfile, workflows, shell, compose, terraform, k8s)
        run: .agent/scripts/kit-run ops
      - name: Tests (+ coverage gate when cmd_coverage is set)
        run: .agent/scripts/kit-run testcov
      - name: Duplicated code
        run: .agent/scripts/kit-run dup
      - run: .agent/scripts/kit-run build
      - name: Diagrams render (docs)
        run: .agent/scripts/kit-run docs

  security:
    name: security (SAST + dependencies)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - name: SAST (semgrep)
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/default --config p/secrets --severity ERROR --error --metrics=off
      - name: Dependency & IaC scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (CycloneDX)
        if: hashFiles('.agent/scripts/kit-sec-scan') != ''
        run: .agent/scripts/kit-sec-scan sbom
      - name: Upload SBOM
        if: hashFiles('.agent/local/sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: sbom, path: .agent/local/sbom.cdx.json }
