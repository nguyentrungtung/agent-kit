# CI of agent-kit itself: lint the kit's shell scripts and workflows, scan for secrets, install the kit into every stack.
name: kit-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -e
          for f in kit install.sh core/.agent/scripts/* core/.agent/hooks/*.sh core/.githooks/* modules/*/setup.sh modules/*/files/.agent/scripts/* tests/*.sh scripts/*.sh; do
            bash -n "$f"
          done
      - name: actionlint (kit workflows + project templates)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: gitleaks
        run: |
          v=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --no-git --source . --no-banner --redact

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: kit init for every stack
        run: tests/smoke.sh "$RUNNER_TEMP/smoke"
      - name: Regressions (upgrade keeps customised skeletons, CI task-gate scope)
        run: tests/regressions.sh "$RUNNER_TEMP/regressions"

  e2e:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Workflow e2e (OpenSpec change → task → gates → finish → archive)
        run: E2E_WORK="$RUNNER_TEMP/e2e" tests/e2e-workflow.sh
